# 端口由 docker-proxy 转发：容器内服务还没起来时，外部连接照样会被接受，直接探
# 127.0.0.1:<port> 会误判成就绪（SFTP 集成测试曾因此卡在握手阶段）。所以每个服务
# 都在容器内探活，`docker compose up --wait` 据此等待；CI 与本地脚本都依赖这一点。
services:
  sftp:
    image: atmoz/sftp:alpine
    command: testuser:testpass:1001::upload
    ports: ['2222:22']
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 22']
      interval: 2s
      timeout: 3s
      retries: 30
  # 终端复用 SFTP 会话的主机与端口，这里要给 sftp 与 shell 同端口的 sshd（atmoz/sftp 只放行 sftp 子系统）。
  ssh:
    image: linuxserver/openssh-server:latest
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: Etc/UTC
      USER_NAME: testuser
      USER_PASSWORD: testpass
      PASSWORD_ACCESS: 'true'
      SUDO_ACCESS: 'false'
    ports: ['2223:2222']
    healthcheck:
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 2222']
      interval: 2s
      timeout: 3s
      retries: 30
  webdav:
    image: bytemark/webdav
    environment:
      AUTH_TYPE: Basic
      USERNAME: testuser
      PASSWORD: testpass
    ports: ['8080:80']
    healthcheck:
      # 镜像里的 busybox wget 没有 --user/--password，只能走 Basic 头；
      # 该值即 testuser:testpass 的 base64，未认证请求会得到 401。
      test:
        [
          'CMD-SHELL',
          "wget -q -O /dev/null --header 'Authorization: Basic dGVzdHVzZXI6dGVzdHBhc3M=' http://127.0.0.1/",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
  # S3 兼容测试服务：s3mock 专为 S3 客户端测试而做。
  # 它不校验签名，任何 Access Key 都能连，正好省掉测试凭据管理。
  s3:
    image: adobe/s3mock:latest
    environment:
      # 配置前缀是 com.adobe.testing.s3mock.*，Spring 绑定环境变量时要把点换成下划线；
      # 写成 initialBuckets 不会生效。启动时预建桶，省掉一次性 init 容器。
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIALBUCKETS: rivet
      # 默认单请求上限 10MB，压过 8 MiB 分片只差一点，留出余量。
      COM_ADOBE_TESTING_S3MOCK_MAX_PAYLOAD_SIZE: 50MB
    ports: ['9000:9090']
    healthcheck:
      # Spring 上下文就绪后才监听端口，这里 TCP 探活等价于 API 可用。
      test: ['CMD', 'bash', '-c', 'exec 3<>/dev/tcp/127.0.0.1/9090']
      interval: 2s
      timeout: 3s
      retries: 60

  smb:
    image: dperson/samba:latest
    # dperson 默认启用 fruit / recycle / streams_xattr；E2E 只验证普通 SMB2 语义，
    # 因此关掉这些 VFS（recycle 会把删除的文件挪进 .deleted 而不是真正删除）。
    command: >
      -u "testuser;testpass"
      -s "rivet;/share;yes;no;no;testuser"
      -w "WORKGROUP"
      -g "server min protocol = SMB2"
      -g "server max protocol = SMB2"
      -g "ntlm auth = yes"
      -g "vfs objects ="
      -p
    ports: ['1445:445']
    volumes:
      - ./smb-share:/share
    healthcheck:
      # 覆盖镜像自带的 `smbclient -L \\localhost -U %`：它 60s 才探一次，且只验证匿名列表。
      test: ['CMD-SHELL', 'smbclient //127.0.0.1/rivet -U testuser%testpass -m SMB2 -c ls']
      interval: 2s
      timeout: 3s
      retries: 30
