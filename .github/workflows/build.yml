name: Build and Package

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '**/.editorconfig'
      - '**/.gitignore'
      - '**/LICENSE*'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/.editorconfig'
      - '**/.gitignore'
      - '**/LICENSE*'
      - '**/*.md'

env:
  # '24' 解析到 24.x 最新稳定版。Electron Forge 的 zip maker 依赖 cross-zip@4.0.1，
  # 它仍调用 fs.rmdir({ recursive })，该 API 在 Node 26 已移除；因此工具链停在 24.x。
  NODE_VERSION: '24'

jobs:
  ci-check:
    name: CI Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Install dependencies
        shell: bash
        run: pnpm install

      - name: Run CI checks
        shell: bash
        run: pnpm run verify

  e2e:
    name: E2E (real SFTP/WebDAV)
    runs-on: ubuntu-latest
    needs: ci-check
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install

      - name: Start test servers
        run: docker compose -f e2e/servers/docker-compose.yml up -d

      - name: Wait for ports
        run: |
          for i in $(seq 1 60); do
            (echo > /dev/tcp/127.0.0.1/2222) >/dev/null 2>&1 && \
            (echo > /dev/tcp/127.0.0.1/8080) >/dev/null 2>&1 && break
            sleep 2
          done

      - name: Install Electron runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk-bridge2.0-0 libgtk-3-0 libgbm1

      - name: Build
        run: pnpm run build

      - name: Run Playwright
        run: xvfb-run -a pnpm exec playwright test

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore

  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: ci-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build-command: pnpm run package:win
            artifact-name: windows-build
            artifact-paths: |
              out/**/*.zip
          - os: ubuntu-latest
            build-command: pnpm run package:linux
            artifact-name: linux-build
            artifact-paths: |
              out/**/*.zip
              out/**/*.deb
          - os: macos-latest
            build-command: pnpm run package:macos
            artifact-name: macos-build
            artifact-paths: |
              out/**/*.zip
              out/**/*.dmg

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Install dependencies
        shell: bash
        run: pnpm install

      - name: Build ${{ matrix.os }} package
        shell: bash
        run: ${{ matrix.build-command }}

      - name: Upload ${{ matrix.os }} artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-paths }}
          if-no-files-found: error
