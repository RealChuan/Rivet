nodeLinker: hoisted

# 允许 exotic 子依赖（解决 @electron/node-gyp 问题）
blockExoticSubdeps: false

# 依赖覆盖
overrides:
  eslint-plugin-react-compiler>zod: '^3.24.4'
  ssh2>cpu-features: 'npm:empty-npm-package@1.0.0'
  # @sentry/bundler-plugins 仍锁 glob@^13，升级到 14 修复 GHSA-3g3m-2fjr-6pw4 与 GHSA-g3hv-75wg-m249
  '@sentry/bundler-plugins>glob': '^14.0.3'

allowBuilds:
  '@swc/core': true
  fs-xattr: true
  macos-alias: true
  ssh2: true

minimumReleaseAgeExclude:
  - '@tanstack/query-core@5.105.1'
  - '@tanstack/react-query@5.105.1'
  - '@tanstack/react-virtual@3.14.25'
  - '@tanstack/virtual-core@3.19.10'
  - globals@17.14.0
  - i18next-cli@1.82.0
  - i18next@26.7.1
  - react-i18next@17.1.11
  - react-resizable-panels@4.16.1
