nodeLinker: hoisted

# 允许 exotic 子依赖（解决 @electron/node-gyp 问题）
blockExoticSubdeps: false

# 依赖覆盖
overrides:
  eslint-plugin-react-compiler>zod: '^3.24.4'
  ssh2>cpu-features: 'npm:empty-npm-package@1.0.0'
  # @sentry/bundler-plugins 仍锁 glob@^13，升级到 14 修复 GHSA-3g3m-2fjr-6pw4 与 GHSA-g3hv-75wg-m249
  '@sentry/bundler-plugins>glob': '^14.0.3'

allowBuilds:
  '@swc/core': true
  fs-xattr: true
  macos-alias: true
  ssh2: true

minimumReleaseAgeExclude:
  - '@tanstack/query-core@5.106.0'
  - '@tanstack/react-query@5.106.0'
  - electron@45.2.3
  - i18next-cli@1.82.5
  - lucide-react@1.68.0
  - react-resizable-panels@4.18.1
