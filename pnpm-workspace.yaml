nodeLinker: hoisted

# 可选：控制 hoisting 范围（v11.5.0+）
hoistingLimits: none # none | workspaces | dependencies

# 允许 exotic 子依赖（解决 @electron/node-gyp 问题）
blockExoticSubdeps: false

# 依赖覆盖
overrides:
  eslint-plugin-react-compiler>zod: '^3.24.4'
  ssh2>cpu-features: 'npm:empty-npm-package@1.0.0'

allowBuilds:
  '@swc/core': true
  cpu-features: true
  fs-xattr: true
  macos-alias: true
  ssh2: true

minimumReleaseAgeExclude:
  - '@sentry/browser-utils@10.60.0'
  - '@sentry/browser@10.60.0'
  - '@sentry/core@10.60.0'
  - '@sentry/electron@7.14.0'
  - '@sentry/feedback@10.60.0'
  - '@sentry/node-core@10.60.0'
  - '@sentry/node@10.60.0'
  - '@sentry/opentelemetry@10.60.0'
  - '@sentry/replay-canvas@10.60.0'
  - '@sentry/replay@10.60.0'
  - '@sentry/server-utils@10.60.0'
  - '@vitejs/plugin-react@6.0.3'
  - electron@42.5.0
  - vite@8.1.0
  - '@types/node@26.0.1'
  - i18next-cli@1.64.2
  - i18next@26.3.2
