nodeLinker: hoisted

# 允许 exotic 子依赖（解决 @electron/node-gyp 问题）
blockExoticSubdeps: false

# 依赖覆盖
overrides:
  eslint-plugin-react-compiler>zod: '^3.24.4'
  ssh2>cpu-features: 'npm:empty-npm-package@1.0.0'
  # @sentry/bundler-plugins 仍锁 glob@^13，升级到 14 修复 GHSA-3g3m-2fjr-6pw4 与 GHSA-g3hv-75wg-m249
  '@sentry/bundler-plugins>glob': '^14.0.3'

allowBuilds:
  '@swc/core': true
  fs-xattr: true
  macos-alias: true
  ssh2: true

minimumReleaseAgeExclude:
  - '@aws-sdk/client-s3@3.1163.0'
  - '@playwright/test@1.65.0'
  - '@tanstack/query-core@5.106.1'
  - '@tanstack/react-query@5.106.1'
  - i18next-cli@1.85.1
  - i18next@26.7.2
  - jsdom@31.0.0
  - lucide-react@1.69.0
  - playwright-core@1.65.0
  - playwright@1.65.0
  - react-i18next@17.1.13
  - undici@8.12.4
  - vite@8.3.6
