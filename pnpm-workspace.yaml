nodeLinker: hoisted

# 允许 exotic 子依赖（解决 @electron/node-gyp 问题）
blockExoticSubdeps: false

# 依赖覆盖
overrides:
  eslint-plugin-react-compiler>zod: '^3.24.4'
  ssh2>cpu-features: 'npm:empty-npm-package@1.0.0'
  # @sentry/bundler-plugins 仍锁 glob@^13，升级到 14 修复 GHSA-3g3m-2fjr-6pw4 与 GHSA-g3hv-75wg-m249
  '@sentry/bundler-plugins>glob': '^14.0.3'

allowBuilds:
  '@swc/core': true
  fs-xattr: true
  macos-alias: true
  ssh2: true

minimumReleaseAgeExclude:
  - '@aws-sdk/client-s3@3.1170.0'
  - '@aws-sdk/s3-request-presigner@3.1170.0'
  - '@typescript-eslint/eslint-plugin@8.73.0'
  - '@typescript-eslint/parser@8.73.0'
  - '@typescript-eslint/project-service@8.73.0'
  - '@typescript-eslint/scope-manager@8.73.0'
  - '@typescript-eslint/tsconfig-utils@8.73.0'
  - '@typescript-eslint/type-utils@8.73.0'
  - '@typescript-eslint/types@8.73.0'
  - '@typescript-eslint/typescript-estree@8.73.0'
  - '@typescript-eslint/utils@8.73.0'
  - '@typescript-eslint/visitor-keys@8.73.0'
  - i18next-cli@1.89.0
  - lucide-react@1.74.0
  - react-i18next@18.0.2
  - typescript-eslint@8.73.0
